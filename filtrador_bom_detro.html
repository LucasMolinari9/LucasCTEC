<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtrador BOM DETRO-RJ</title>
  <style>
    /* ── Paleta Claude dark ──────────────────────────────────── */
    :root {
      --bg:        #1C1917;   /* fundo da página  */
      --surface:   #292524;   /* card/container   */
      --surface2:  #3C3836;   /* linhas pares, hover base */
      --border:    #44403C;   /* bordas           */
      --border2:   #57534E;   /* bordas secundárias */
      --text:      #E7E5E4;   /* texto principal  */
      --muted:     #A8A29E;   /* texto suave      */
      --accent:    #D97757;   /* laranja Claude   */
      --accent-dk: #C4623E;   /* hover do acento  */
      --green:     #4ADE80;   /* ok / copiado     */
      --red:       #F87171;   /* erro             */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 56px;
      font-size: 16px;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
      overflow: hidden;
    }

    /* ── Cabeçalho ───────────────────────────────────────────── */
    .page-header {
      background: #231F1C;
      border-bottom: 2px solid var(--accent);
      padding: 22px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .page-header-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .2px;
    }

    .page-header p {
      font-size: .88rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Controles ───────────────────────────────────────────── */
    .controls {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      align-items: flex-end;
      background: #221E1B;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-radius: 7px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text);
      font-weight: 600;
      transition: border-color .15s, background .15s;
    }

    .file-label:hover {
      border-color: var(--accent);
      background: #4A3830;
    }

    #fileInput { display: none; }

    .file-status {
      font-size: .88rem;
      color: var(--muted);
      margin-top: 2px;
      min-height: 1.3em;
    }

    .file-status.ok  { color: var(--green); }
    .file-status.err { color: var(--red); }

    input[type="text"] {
      padding: 10px 14px;
      border: 1.5px solid var(--border2);
      border-radius: 7px;
      font-size: 1rem;
      width: 220px;
      outline: none;
      background: var(--surface2);
      color: var(--text);
      transition: border-color .15s;
    }

    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent); }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .08s;
    }

    .btn:active { transform: scale(.97); }

    .btn-filter {
      background: var(--accent);
      color: #fff;
      align-self: flex-end;
    }

    .btn-filter:hover { background: var(--accent-dk); }

    .btn-copy {
      background: #2D4A3A;
      color: var(--green);
      border: 1px solid #3D6B50;
      font-size: .95rem;
      padding: 8px 20px;
    }

    .btn-copy:hover { background: #3A5E4A; }
    .btn-copy.copied { background: #1e3a5f; color: #93C5FD; border-color: #3B82F6; }

    /* ── Resultados ──────────────────────────────────────────── */
    #results { padding: 28px 32px; min-height: 60px; }

    .msg-error {
      color: var(--red);
      background: #2D1B1B;
      border: 1px solid #5C2E2E;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 1rem;
    }

    .msg-error code {
      display: block;
      margin-top: 8px;
      font-size: .85rem;
      color: var(--muted);
      word-break: break-all;
    }

    .result-box { }

    .line-header {
      background: #231F1C;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--accent);
      padding: 16px 22px 14px;
      border-radius: 9px 9px 0 0;
    }

    .line-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .line-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 6px;
      font-size: .9rem;
      color: var(--muted);
    }

    .line-meta span { color: var(--text); }
    .line-meta span::before { content: '● '; color: var(--accent); }

    /* ── Tabela ──────────────────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 9px 9px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
      white-space: nowrap;
    }

    thead tr:first-child th {
      background: #2E2A27;
      border-bottom: 1px solid var(--border2);
      color: var(--accent);
      font-size: .95rem;
    }

    thead tr:last-child th {
      background: #271F1C;
      border-bottom: 2px solid var(--border);
      font-weight: 600;
      color: var(--muted);
      font-size: .88rem;
    }

    th, td {
      padding: 10px 14px;
      border-right: 1px solid var(--border);
      text-align: left;
    }

    th:last-child, td:last-child { border-right: none; }

    .th-sec  { width: 100px; }
    .th-nome { min-width: 200px; }
    .th-month { text-align: center; }
    .th-dir { text-align: right; }

    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:nth-child(even) { background: #241F1D; }
    tbody tr:hover { background: #332C28; }

    .td-cod {
      font-family: 'Courier New', monospace;
      color: var(--muted);
      font-size: .95rem;
    }

    .td-num {
      text-align: right;
      font-family: 'Courier New', monospace;
      color: #FCD34D;
      font-size: 1rem;
    }

    .zero { color: var(--border2); }

    .copy-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    /* ── Debug de colunas ────────────────────────────────────── */
    .debug-cols {
      margin-top: 14px;
      font-size: .88rem;
      color: var(--muted);
      background: #221E1B;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 16px;
    }

    .debug-cols summary { cursor: pointer; font-weight: 600; color: var(--muted); }
    .debug-cols summary:hover { color: var(--text); }

    .debug-cols table { font-size: .85rem; margin-top: 8px; }
    .debug-cols td, .debug-cols th { padding: 4px 10px; border: 1px solid var(--border); color: var(--text); }
    .debug-cols th { background: #2E2A27; color: var(--muted); }
    .debug-ok      { color: var(--green) !important; }
    .debug-missing { color: var(--red)   !important; }
  </style>
</head>
<body>
<div class="container">

  <div class="page-header">
    <div class="page-header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    </div>
    <div>
      <h1>Filtrador BOM — DETRO-RJ</h1>
      <p>Boletim de Operação e Monitoramento · carregue o CSV e informe o código da linha</p>
    </div>
  </div>

  <div class="controls">
    <div class="field-group">
      <label>Arquivo CSV</label>
      <label class="file-label" for="fileInput">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Selecionar arquivo…
      </label>
      <input type="file" id="fileInput" accept=".csv,.txt">
      <span class="file-status" id="fileStatus">Nenhum arquivo carregado</span>
    </div>

    <div class="field-group">
      <label>Código da Linha</label>
      <input type="text" id="lineCode" placeholder="ex: 132005000" maxlength="30">
    </div>

    <button class="btn btn-filter" onclick="filter()">Filtrar</button>
  </div>

  <div id="results"></div>
</div>

<script>
'use strict';

let rows = [];
let headers = [];
let lastResult = null;

/* ── FILE LOADING ─────────────────────────────────────────── */
document.getElementById('fileInput').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  setStatus('Carregando…', '');
  const reader = new FileReader();
  reader.onload = function (ev) {
    try {
      const decoder = new TextDecoder('windows-1252');
      const text = decoder.decode(ev.target.result);
      parseCSV(text);
      setStatus('✔ ' + rows.length.toLocaleString('pt-BR') + ' registros carregados — ' + file.name, 'ok');
    } catch (ex) {
      setStatus('Erro ao ler arquivo: ' + ex.message, 'err');
    }
  };
  reader.onerror = function () { setStatus('Erro ao abrir o arquivo.', 'err'); };
  reader.readAsArrayBuffer(file);
});

function setStatus(msg, cls) {
  const el = document.getElementById('fileStatus');
  el.textContent = msg;
  el.className = 'file-status' + (cls ? ' ' + cls : '');
}

/* ── CSV PARSER ───────────────────────────────────────────── */
function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  headers = splitLine(lines[0] || '');
  rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = splitLine(lines[i]);
    if (cols.every(c => !c)) continue;
    const row = {};
    headers.forEach((h, j) => { row[h] = (cols[j] || '').trim(); });
    rows.push(row);
  }
}

function splitLine(line) {
  const result = [];
  let field = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i + 1] === '"') { field += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ';' && !inQ) {
      result.push(field.trim());
      field = '';
    } else {
      field += ch;
    }
  }
  result.push(field.trim());
  return result;
}

/* ── COLUMN DETECTION ─────────────────────────────────────── */

// Normaliza para comparação: remove diacríticos, preposições PT, e tudo que não for A-Z0-9.
// Ex: "Código da Linha" → "CODIGOLINHA", "Tipo de Veículo" → "TIPOVEICULO"
function norm(s) {
  // strip diacritics: NFD decomposes accented chars, then we drop combining marks U+0300-U+036F
  var noDiac = (s || '').normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '');
  return noDiac
    .toUpperCase()
    .replace(/\b(DA|DE|DO|DAS|DOS|DES|EM|NO|NA|NOS|NAS)\b/g, '')
    .replace(/[^A-Z0-9]/g, '');
}

function findCol(patterns) {
  const normHeaders = headers.map(norm);
  const normPats = patterns.map(norm).filter(Boolean);
  // 1. Exact match
  for (const p of normPats) {
    const idx = normHeaders.indexOf(p);
    if (idx !== -1) return headers[idx];
  }
  // 2. Substring match (header contains pattern or vice-versa)
  for (const p of normPats) {
    if (p.length < 3) continue;
    const idx = normHeaders.findIndex(h => h.includes(p) || p.includes(h));
    if (idx !== -1) return headers[idx];
  }
  return null;
}

function detectColumns() {
  return {
    lineCod:  findCol(['CODIGOLINHA','CODLINHA','LINHACODIGO','CDLINHA','LINHACD','CODIGOLINHA','CODLINHA']),
    lineName: findCol(['NOMELINHA','NOMEDLINHA','DESCLINHA','DESCRICAOLINHA','NOMLINHA','LINNOME']),
    empresa:  findCol(['EMPRESA','NOMEEMPRESA','OPERADORA','CONSORCIO','CONSORCIADA']),
    tipoVei:  findCol(['TIPOVEICULO','TIPOVEI','VEICULOTIPO','TIPODEVECULO']),
    cap:      findCol(['CAPACIDADELINHA','CAPLINHA','CAPACIDADE','CAPAC']),
    mes:      findCol(['ANOMES','MESANO','PERIODO','COMPETENCIA','DATAMES','MES','REFERENCIA','ANOMES']),
    secCod:   findCol(['CODIGOSECAO','CODSECAO','SECCOD','CDSECAO','SECAOCODIGO']),
    secNome:  findCol(['NOMESECAO','DESCSECAO','NOMSECAO','DESCRICAOSECAO','SECAONOME']),
    ab:       findCol(['MEDIAAB','MEDAB','PASSAGEIROSAB','PASSAB','DEMANDAAB','DEMAB','MEDIASAB']),
    ba:       findCol(['MEDIABA','MEDBA','PASSAGEIROSBA','PASSBA','DEMANDABA','DEMBA','MEDIASBA']),
  };
}

/* ── FILTER ───────────────────────────────────────────────── */
function filter() {
  const code = document.getElementById('lineCode').value.trim();
  const out = document.getElementById('results');
  lastResult = null;

  if (!rows.length) { out.innerHTML = msgErr('Carregue um arquivo CSV primeiro.'); return; }
  if (!code) { out.innerHTML = msgErr('Digite o código da linha.'); return; }

  const C = detectColumns();

  if (!C.lineCod) {
    out.innerHTML = msgErr(
      'Coluna de código de linha não identificada. Verifique se o arquivo é um BOM DETRO-RJ válido.',
      'Colunas encontradas: ' + headers.join(' | ')
    );
    return;
  }

  const filtered = rows.filter(r => (r[C.lineCod] || '').trim() === code);
  if (!filtered.length) {
    out.innerHTML = msgErr(`Linha "${esc(code)}" não encontrada no arquivo.`);
    return;
  }

  const first = filtered[0];
  const info = {
    code,
    name:    C.lineName ? first[C.lineName] : '—',
    empresa: C.empresa  ? first[C.empresa]  : '—',
    tipoVei: C.tipoVei  ? first[C.tipoVei]  : '—',
    cap:     C.cap      ? first[C.cap]      : '—',
  };

  /* 4 most recent months */
  const allMonths = [...new Set(filtered.map(r => C.mes ? r[C.mes] : '').filter(Boolean))];
  allMonths.sort((a, b) => parseMonth(b) - parseMonth(a));
  const months = allMonths.slice(0, 4).reverse();

  /* sections — accumulate ab/ba sums + counts to average if duplicates */
  const secOrder = [];
  const secMap = new Map();

  filtered.forEach(r => {
    const mes = C.mes ? r[C.mes] : '';
    if (!months.includes(mes)) return;
    const secCod  = C.secCod  ? r[C.secCod]  : '';
    const secNome = C.secNome ? r[C.secNome] : '';
    const ab = toNum(C.ab ? r[C.ab] : '');
    const ba = toNum(C.ba ? r[C.ba] : '');
    const key = (secCod || '') + '||' + (secNome || '');
    if (!secMap.has(key)) {
      secMap.set(key, { cod: secCod, nome: secNome, months: {} });
      secOrder.push(key);
    }
    const entry = secMap.get(key);
    if (!entry.months[mes]) entry.months[mes] = { sumAB: 0, sumBA: 0, n: 0 };
    entry.months[mes].sumAB += ab;
    entry.months[mes].sumBA += ba;
    entry.months[mes].n++;
  });

  const sections = secOrder.map(k => {
    const s = secMap.get(k);
    const mdata = {};
    months.forEach(m => {
      const d = s.months[m];
      mdata[m] = d ? { ab: d.sumAB / d.n, ba: d.sumBA / d.n } : null;
    });
    return { cod: s.cod, nome: s.nome, months: mdata };
  });

  lastResult = { info, months, sections, C };
  out.innerHTML = renderHTML(info, months, sections, C);
}

/* ── MONTH HELPERS ────────────────────────────────────────── */
function parseMonth(s) {
  s = (s || '').trim();
  let m;
  if ((m = s.match(/^(\d{4})-?(\d{2})$/)))       return +m[1] * 100 + +m[2];
  if ((m = s.match(/^(\d{2})\/(\d{4})$/)))        return +m[2] * 100 + +m[1];
  if ((m = s.match(/^(\d{2})-(\d{4})$/)))         return +m[2] * 100 + +m[1];
  if ((m = s.match(/^([A-ZÇ]{3})[\/\-](\d{4})$/i))) {
    const nm = {JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
    return +m[2] * 100 + (nm[m[1].toUpperCase()] || 0);
  }
  return 0;
}

function fmtMonth(s) {
  s = (s || '').trim();
  const nm = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let m;
  if ((m = s.match(/^(\d{4})-?(\d{2})$/))) return nm[+m[2]-1] + '/' + m[1];
  if ((m = s.match(/^(\d{2})\/(\d{4})$/))) return nm[+m[1]-1] + '/' + m[2];
  return s;
}

/* ── HELPERS ──────────────────────────────────────────────── */
function toNum(v) {
  return parseFloat((v || '0').replace(',', '.')) || 0;
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function msgErr(msg, detail) {
  let h = `<div class="msg-error">${msg}`;
  if (detail) h += `<code>${esc(detail)}</code>`;
  h += '</div>';
  return h;
}

/* ── RENDER ───────────────────────────────────────────────── */
function renderHTML(info, months, sections, C) {
  const mf = months.map(fmtMonth);

  let h = `
  <div class="result-box">
    <div class="line-header">
      <div class="line-title">${esc(info.code)} &ndash; ${esc(info.name)}</div>
      <div class="line-meta">
        <span>Empresa: ${esc(info.empresa)}</span>
        <span>Tipo de Veículo: ${esc(info.tipoVei)}</span>
        <span>Capacidade da Linha: ${esc(info.cap)}</span>
      </div>
    </div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th rowspan="2" class="th-sec">Cód. Seção</th>
          <th rowspan="2" class="th-nome">Nome da Seção</th>`;

  mf.forEach(m => {
    h += `<th colspan="2" class="th-month">${m}</th>`;
  });
  h += `</tr><tr>`;
  months.forEach(() => {
    h += `<th class="th-dir">Média A→B</th><th class="th-dir">Média B→A</th>`;
  });
  h += `</tr></thead><tbody>`;

  sections.forEach(sec => {
    h += `<tr>
      <td class="td-cod">${esc(sec.cod)}</td>
      <td>${esc(sec.nome)}</td>`;
    months.forEach(m => {
      const d = sec.months[m];
      const ab = d !== null ? Math.round(d.ab) : 0;
      const ba = d !== null ? Math.round(d.ba) : 0;
      const cls = (ab === 0 && ba === 0) ? ' zero' : '';
      h += `<td class="td-num${cls}">${ab}</td><td class="td-num${cls}">${ba}</td>`;
    });
    h += `</tr>`;
  });

  h += `</tbody></table></div>

  <div class="copy-row">
    <button class="btn btn-copy" id="btnCopy" onclick="copyResult()">Copiar resultado</button>
  </div>`;

  /* column debug */
  const colLabels = {
    lineCod:'Cód. Linha', lineName:'Nome Linha', empresa:'Empresa',
    tipoVei:'Tipo Veículo', cap:'Capacidade', mes:'Mês/Período',
    secCod:'Cód. Seção', secNome:'Nome Seção', ab:'Média A→B', ba:'Média B→A'
  };
  h += `<details class="debug-cols"><summary>Colunas detectadas no arquivo</summary>
  <table><thead><tr><th>Campo</th><th>Coluna CSV</th></tr></thead><tbody>`;
  Object.entries(colLabels).forEach(([k, label]) => {
    const val = C[k];
    h += `<tr><td>${label}</td><td class="${val ? 'debug-ok' : 'debug-missing'}">${val ? esc(val) : '— não encontrado —'}</td></tr>`;
  });
  h += `</tbody></table></details></div>`;

  return h;
}

/* ── COPY ─────────────────────────────────────────────────── */
function copyResult() {
  if (!lastResult) return;
  const { info, months, sections } = lastResult;
  const mf = months.map(fmtMonth);

  const pad  = (s, n) => String(s).padEnd(n);
  const rpad = (s, n) => String(s).padStart(n);

  const maxCod  = Math.max(8, ...sections.map(s => s.cod.length));
  const maxNome = Math.max(10, ...sections.map(s => s.nome.length));
  const numW = 10;

  let lines = [];
  lines.push(`Linha: ${info.code} – ${info.name}`);
  lines.push(`Empresa: ${info.empresa}`);
  lines.push(`Tipo de Veículo: ${info.tipoVei}  |  Capacidade da Linha: ${info.cap}`);
  lines.push(`Período analisado: ${mf.join(', ')}`);
  lines.push('');

  /* header row 1 */
  let h1 = pad('Cód. Seção', maxCod + 2) + pad('Nome da Seção', maxNome + 2);
  mf.forEach(m => {
    h1 += rpad(m + ' A→B', numW + 2) + rpad(m + ' B→A', numW + 2);
  });
  lines.push(h1);
  lines.push('─'.repeat(h1.length));

  sections.forEach(sec => {
    let row = pad(sec.cod, maxCod + 2) + pad(sec.nome, maxNome + 2);
    months.forEach(m => {
      const d = sec.months[m];
      row += rpad(d !== null ? Math.round(d.ab) : 0, numW + 2);
      row += rpad(d !== null ? Math.round(d.ba) : 0, numW + 2);
    });
    lines.push(row);
  });

  const text = lines.join('\n');

  const btn = document.getElementById('btnCopy');

  const success = () => {
    btn.textContent = '✔ Copiado!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar resultado'; btn.classList.remove('copied'); }, 2200);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(success).catch(() => fallbackCopy(text, success));
  } else {
    fallbackCopy(text, success);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (_) {}
  document.body.removeChild(ta);
}

/* Enter key triggers filter */
document.getElementById('lineCode').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') filter();
});
</script>
