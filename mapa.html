<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Rio de Janeiro — DETRO-RJ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde:      #1a5c2a;
      --verde-c:    #2e7d42;
      --dourado:    #c9a227;
      --bg:         #f4f6f8;
      --border:     #d0d7de;
      --text:       #1c2526;
      --muted:      #586069;
      --sidebar-w:  350px;
    }

    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }

    body { display: flex; color: var(--text); }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,.1);
      z-index: 1000;
      flex-shrink: 0;
    }

    .sb-header {
      background: var(--verde);
      color: #fff;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }
    .sb-logo {
      width: 40px; height: 40px;
      background: var(--dourado);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px; color: var(--verde);
      flex-shrink: 0;
    }
    .sb-header h1 { font-size: .9rem; font-weight: 700; }
    .sb-header p  { font-size: .7rem; opacity: .8; margin-top: 2px; }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid var(--border);
      background: #fafbfc;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; padding: 10px 4px;
      font-size: .76rem; font-weight: 700;
      border: none; background: none; cursor: pointer;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color .2s, border-color .2s, background .2s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .tab-btn.active { color: var(--verde); border-bottom-color: var(--verde); background: #fff; }
    .tab-btn:hover:not(.active) { color: var(--verde-c); background: #f0f5f0; }

    /* ── TAB CONTENT ── */
    .tab-pane {
      display: none; flex-direction: column;
      flex: 1; overflow-y: auto;
      padding: 14px; gap: 11px;
    }
    .tab-pane.active { display: flex; }

    /* ── LABELS ── */
    .sec-label {
      font-size: .7rem; text-transform: uppercase;
      letter-spacing: .5px; color: var(--muted); font-weight: 700;
    }

    /* ── SEARCH / INPUT ── */
    .input-wrap { position: relative; }
    .s-input {
      width: 100%;
      padding: 9px 36px 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .86rem; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .s-input:focus {
      border-color: var(--verde-c);
      box-shadow: 0 0 0 3px rgba(46,125,66,.12);
    }
    .s-ico {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: .9rem; pointer-events: none;
    }

    /* ── AUTOCOMPLETE ── */
    .ac-drop {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,.13);
      max-height: 230px; overflow-y: auto;
      z-index: 9999; display: none;
    }
    .ac-drop.open { display: block; }
    .ac-item {
      padding: 8px 12px; cursor: pointer;
      font-size: .82rem; border-bottom: 1px solid #f0f0f0;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: #f0f6f0; }
    .ac-ico { flex-shrink: 0; margin-top: 1px; }
    .ac-name { font-weight: 600; color: var(--text); line-height: 1.3; }
    .ac-sub  { font-size: .73rem; color: var(--muted); margin-top: 1px; }
    .ac-msg  { padding: 10px 12px; font-size: .8rem; color: var(--muted); text-align: center; }

    /* ── BUTTONS ── */
    .btn {
      padding: 9px 14px; border-radius: 7px;
      font-size: .84rem; font-weight: 600;
      cursor: pointer; border: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .2s, transform .1s; width: 100%;
    }
    .btn:active { transform: scale(.98); }
    .btn-g  { background: var(--verde);  color: #fff; }
    .btn-g:hover { background: var(--verde-c); }
    .btn-g:disabled { background: #9e9e9e; cursor: not-allowed; transform: none; }
    .btn-o  { background: #fff; color: var(--verde); border: 1px solid var(--verde); }
    .btn-o:hover { background: #e8f5e9; }
    .btn-r  { background: #fff; color: #c62828; border: 1px solid #ef9a9a; }
    .btn-r:hover { background: #ffebee; }

    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    /* ── ROUTE ── */
    .rt-label {
      font-size: .73rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .4px;
      display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
    }
    .rt-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-o { background: #2e7d32; }
    .dot-d { background: #c62828; }
    .rt-connector {
      width: 2px; height: 12px;
      background: #ccc; margin-left: 4px; margin-bottom: -4px;
    }

    .info-box {
      background: #e8f5e9; border: 1px solid #a5d6a7;
      border-radius: 8px; padding: 11px 14px;
      display: none;
    }
    .info-box.show { display: block; }
    .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-lbl { font-size: .73rem; color: var(--muted); text-transform: uppercase; }
    .info-val { font-size: .9rem; font-weight: 700; color: var(--verde); }

    /* ── MUNICIPALITY ── */
    .muni-list {
      flex: 1; overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 0;
    }
    .muni-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 11px; border-bottom: 1px solid #f0f0f0;
      font-size: .83rem; transition: background .15s;
    }
    .muni-item:last-child { border-bottom: none; }
    .muni-item:hover { background: #f5f8f5; }
    .muni-item.on { background: #e8f5e9; }
    .muni-cb {
      width: 15px; height: 15px; cursor: pointer;
      accent-color: var(--verde); flex-shrink: 0;
    }
    .muni-nm { flex: 1; font-weight: 500; cursor: pointer; user-select: none; }
    .muni-clr {
      width: 22px; height: 22px;
      border-radius: 5px; border: 2px solid rgba(0,0,0,.15);
      cursor: pointer; padding: 0; flex-shrink: 0;
      appearance: none; -webkit-appearance: none;
    }
    .muni-spin {
      width: 12px; height: 12px;
      border: 2px solid #ccc; border-top-color: var(--verde);
      border-radius: 50%; animation: spin .6s linear infinite;
      display: none; flex-shrink: 0;
    }
    .muni-spin.a { display: inline-block; }

    /* ── SPINNER ── */
    .sp {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%; animation: spin .65s linear infinite;
      display: none;
    }
    .sp.a { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR ── */
    .err {
      background: #ffebee; border: 1px solid #ef9a9a;
      border-radius: 6px; padding: 8px 12px;
      font-size: .78rem; color: #c62828; display: none;
    }
    .err.show { display: block; }

    /* ── RESULT CARD ── */
    .result-card {
      background: #f0f6f0; border: 1px solid #a5d6a7;
      border-radius: 8px; padding: 10px 12px;
      font-size: .83rem; display: none;
    }
    .result-card.show { display: block; }
    .result-card strong { display: block; margin-bottom: 3px; }
    .result-card small { color: var(--muted); }

    /* ── MAP ── */
    #map { flex: 1; height: 100vh; }

    /* ── HOME BUTTON ── */
    .leaflet-control-home a {
      font-size: 16px !important;
      line-height: 30px !important;
    }

    /* Tooltip municipality */
    .muni-tip {
      background: rgba(0,0,0,.75); color: #fff;
      border: none; border-radius: 5px;
      font-size: .78rem; font-weight: 600;
      padding: 4px 9px; box-shadow: none;
    }
    .muni-tip::before { display: none; }

    /* Responsive */
    @media (max-width: 640px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100vw; height: 48vh; }
      #map { height: 52vh; }
    }
  </style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<div id="sidebar">

  <div class="sb-header">
    <div class="sb-logo">DT</div>
    <div>
      <h1>Mapa Rio de Janeiro</h1>
      <p>DETRO-RJ · Controle Territorial</p>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('buscar')" id="tbtn-buscar">🔍 Buscar</button>
    <button class="tab-btn"        onclick="switchTab('rota')"   id="tbtn-rota">🗺 Rota</button>
    <button class="tab-btn"        onclick="switchTab('muni')"   id="tbtn-muni">🏙 Municípios</button>
  </div>

  <!-- ── TAB: BUSCAR ── -->
  <div class="tab-pane active" id="pane-buscar">
    <div class="sec-label">Buscar localidade, rua, bairro ou município</div>

    <div class="input-wrap">
      <input class="s-input" id="searchInp" type="text"
             placeholder="Ex: Copacabana, Av. Brasil, Niterói…"
             autocomplete="off" />
      <span class="s-ico">🔍</span>
      <div class="ac-drop" id="searchDrop"></div>
    </div>

    <div class="err" id="searchErr"></div>

    <div class="result-card" id="searchCard">
      <strong id="searchCardName"></strong>
      <small id="searchCardAddr"></small>
    </div>

    <button class="btn btn-r" id="btnClearSearch" onclick="clearSearch()" style="display:none;">
      ✕ Limpar marcador
    </button>
  </div>

  <!-- ── TAB: ROTA ── -->
  <div class="tab-pane" id="pane-rota">

    <div>
      <div class="rt-label"><span class="rt-dot dot-o"></span> Origem</div>
      <div class="input-wrap">
        <input class="s-input" id="originInp" type="text"
               placeholder="Ponto de partida…" autocomplete="off" />
        <span class="s-ico">📍</span>
        <div class="ac-drop" id="originDrop"></div>
      </div>
    </div>

    <div class="rt-connector"></div>

    <div>
      <div class="rt-label"><span class="rt-dot dot-d"></span> Destino</div>
      <div class="input-wrap">
        <input class="s-input" id="destInp" type="text"
               placeholder="Ponto de chegada…" autocomplete="off" />
        <span class="s-ico">🏁</span>
        <div class="ac-drop" id="destDrop"></div>
      </div>
    </div>

    <div class="err" id="routeErr"></div>

    <button class="btn btn-g" onclick="calcRoute()" id="btnCalc">
      <span class="sp" id="routeSp"></span>
      Calcular Rota
    </button>

    <div class="info-box" id="routeInfo">
      <div class="info-row">
        <span class="info-lbl">Distância</span>
        <span class="info-val" id="infoDist">—</span>
      </div>
      <div class="info-row">
        <span class="info-lbl">Tempo estimado</span>
        <span class="info-val" id="infoTime">—</span>
      </div>
    </div>

    <button class="btn btn-r" id="btnClearRoute" onclick="clearRoute()" style="display:none;">
      ✕ Limpar rota
    </button>

  </div>

  <!-- ── TAB: MUNICÍPIOS ── -->
  <div class="tab-pane" id="pane-muni">
    <div class="sec-label">Destacar municípios no mapa com cores</div>

    <div class="input-wrap">
      <input class="s-input" id="muniFilter" type="text"
             placeholder="Filtrar município…" oninput="filterMunis()" />
      <span class="s-ico">🔎</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-o" onclick="markAllVisible()" style="font-size:.76rem;">Marcar visíveis</button>
      <button class="btn btn-r" onclick="clearAllMunis()" style="font-size:.76rem;">Limpar todos</button>
    </div>

    <div class="err" id="muniErr"></div>

    <div class="muni-list" id="muniList">
      <div class="ac-msg">Clique na aba para carregar…</div>
    </div>
  </div>

</div><!-- /sidebar -->

<!-- ═══════════════ MAP ═══════════════ -->
<div id="map"></div>

<script>
/* ══════════════════════════════════════════════
   MAP INIT
══════════════════════════════════════════════ */
const RJ_CENTER = [-22.5, -43.17];
const RJ_ZOOM   = 8;

const map = L.map('map', { center: RJ_CENTER, zoom: RJ_ZOOM, zoomControl: false });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a> contributors | Rotas: OSRM | Fronteiras: IBGE',
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// Home button
const HomeControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const c = L.DomUtil.create('div', 'leaflet-bar leaflet-control-home');
    const a = L.DomUtil.create('a', '', c);
    a.title = 'Voltar ao Rio de Janeiro';
    a.innerHTML = '🏠';
    a.style.cssText = 'display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;';
    L.DomEvent.on(a, 'click', e => {
      L.DomEvent.stopPropagation(e);
      map.flyTo(RJ_CENTER, RJ_ZOOM, { duration: 1 });
    });
    return c;
  }
});
new HomeControl().addTo(map);

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let searchMarker   = null;
let routePolyline  = null;
let routePins      = [];
let originLatLon   = null;
let destLatLon     = null;
let muniData       = [];       // [{id, nome}]
let muniLayers     = {};       // id → L.GeoJSON
let muniColors     = {};       // id → hex color

const PALETTE = [
  '#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6',
  '#1abc9c','#e67e22','#16a085','#d81b60','#00897b',
  '#fb8c00','#6d4c41','#546e7a','#7b1fa2','#0288d1'
];
let _pi = 0;
const pickColor = () => PALETTE[_pi++ % PALETTE.length];

/* ══════════════════════════════════════════════
   TABS
══════════════════════════════════════════════ */
let _muniLoaded = false;

function switchTab(name) {
  ['buscar','rota','muni'].forEach(t => {
    document.getElementById('tbtn-' + t).classList.toggle('active', t === name);
    document.getElementById('pane-' + t).classList.toggle('active', t === name);
  });
  if (name === 'muni' && !_muniLoaded) { _muniLoaded = true; loadMunis(); }
}

/* ══════════════════════════════════════════════
   NOMINATIM (viewbox: left,top,right,bottom = W,N,E,S)
══════════════════════════════════════════════ */
const VIEWBOX = '-44.9,-20.7,-40.9,-23.4';

async function geocode(query) {
  const url = 'https://nominatim.openstreetmap.org/search'
    + `?q=${encodeURIComponent(query)}`
    + '&format=json&limit=6&countrycodes=br'
    + `&viewbox=${VIEWBOX}&bounded=1&addressdetails=1`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Serviço de busca indisponível');
  return r.json();
}

function itemLabel(r) {
  return r.display_name.split(',').slice(0, 2).join(',').trim();
}
function itemSub(r) {
  return r.display_name.split(',').slice(2, 5).join(',').trim();
}
function itemIcon(r) {
  const t = r.type || r.class || '';
  if (/motorway|trunk|primary|secondary|tertiary|residential|road|street|path/.test(t)) return '🛣';
  if (/city|town|village|municipality|neighbourhood|suburb|quarter/.test(t)) return '🏙';
  if (/bus|station|stop/.test(t)) return '🚌';
  if (/school|university|college/.test(t)) return '🏫';
  if (/hospital|clinic|pharmacy/.test(t)) return '🏥';
  return '📍';
}

/* ── Generic autocomplete wiring ── */
function wireAutocomplete(inputId, dropId, onSelect) {
  const inp = document.getElementById(inputId);
  const dd  = document.getElementById(dropId);
  let timer = null;

  inp.addEventListener('input', () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if (q.length < 2) { closeAC(dd); return; }
    timer = setTimeout(() => runAC(q, dd, onSelect), 420);
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') closeAC(dd); });
  inp.addEventListener('focus', () => {
    const q = inp.value.trim();
    if (q.length >= 2 && !dd.classList.contains('open')) {
      timer = setTimeout(() => runAC(q, dd, onSelect), 420);
    }
  });
}

async function runAC(q, dd, onSelect) {
  dd.innerHTML = '<div class="ac-msg">Buscando…</div>';
  dd.classList.add('open');
  try {
    const results = await geocode(q);
    if (!results.length) { dd.innerHTML = '<div class="ac-msg">Nenhum resultado.</div>'; return; }
    dd.innerHTML = '';
    results.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'ac-item';
      el.innerHTML = `<span class="ac-ico">${itemIcon(r)}</span>`
        + `<div><div class="ac-name">${itemLabel(r)}</div>`
        + `<div class="ac-sub">${itemSub(r)}</div></div>`;
      el.addEventListener('mousedown', e => {
        e.preventDefault();
        onSelect(r);
        closeAC(dd);
      });
      dd.appendChild(el);
    });
  } catch {
    closeAC(dd);
  }
}

function closeAC(dd) {
  dd.classList.remove('open');
}

function closeAllAC() {
  ['searchDrop','originDrop','destDrop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) closeAC(el);
  });
}

map.on('click', closeAllAC);
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.input-wrap')) closeAllAC();
});

/* ══════════════════════════════════════════════
   SEARCH TAB
══════════════════════════════════════════════ */
wireAutocomplete('searchInp', 'searchDrop', r => {
  const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
  const name = itemLabel(r), addr = itemSub(r);

  document.getElementById('searchInp').value = name;

  if (searchMarker) map.removeLayer(searchMarker);
  searchMarker = L.marker([lat, lon])
    .addTo(map)
    .bindPopup(`<strong>${name}</strong><br><small>${addr}</small>`, { maxWidth: 260 })
    .openPopup();

  map.flyTo([lat, lon], 15, { duration: 1.2 });

  document.getElementById('searchCardName').textContent = name;
  document.getElementById('searchCardAddr').textContent = addr;
  document.getElementById('searchCard').classList.add('show');
  document.getElementById('btnClearSearch').style.display = '';
  setErr('searchErr', '');
});

function clearSearch() {
  if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
  document.getElementById('searchInp').value = '';
  document.getElementById('searchCard').classList.remove('show');
  document.getElementById('btnClearSearch').style.display = 'none';
}

/* ══════════════════════════════════════════════
   ROUTE TAB
══════════════════════════════════════════════ */
wireAutocomplete('originInp', 'originDrop', r => {
  originLatLon = [parseFloat(r.lat), parseFloat(r.lon)];
  document.getElementById('originInp').value = itemLabel(r);
});
wireAutocomplete('destInp', 'destDrop', r => {
  destLatLon = [parseFloat(r.lat), parseFloat(r.lon)];
  document.getElementById('destInp').value = itemLabel(r);
});

async function calcRoute() {
  setErr('routeErr', '');

  if (!originLatLon) { setErr('routeErr', 'Selecione a origem a partir dos resultados da busca.'); return; }
  if (!destLatLon)   { setErr('routeErr', 'Selecione o destino a partir dos resultados da busca.'); return; }

  const btn = document.getElementById('btnCalc');
  const sp  = document.getElementById('routeSp');
  btn.disabled = true; sp.classList.add('a');

  clearRoute(false);

  try {
    const [oLat, oLon] = originLatLon;
    const [dLat, dLon] = destLatLon;

    const url = `https://router.project-osrm.org/route/v1/driving/${oLon},${oLat};${dLon},${dLat}`
              + `?overview=full&geometries=geojson&steps=false`;

    const res  = await fetch(url);
    if (!res.ok) throw new Error('Servidor de rotas indisponível. Tente novamente.');
    const data = await res.json();

    if (data.code !== 'Ok' || !data.routes?.length) throw new Error('Rota não encontrada entre os pontos selecionados.');

    const route = data.routes[0];

    // Draw polyline
    routePolyline = L.geoJSON(route.geometry, {
      style: { color: '#1565c0', weight: 5, opacity: .88, lineJoin: 'round', lineCap: 'round' }
    }).addTo(map);

    // Pins
    const mkIcon = (color, emoji) => L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;background:${color};border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:8px;">${emoji}</div>`,
      iconSize: [16,16], iconAnchor: [8,8]
    });

    const oPin = L.marker(originLatLon, { icon: mkIcon('#2e7d32','●') })
      .addTo(map)
      .bindPopup('<strong>Origem</strong><br>' + document.getElementById('originInp').value);
    const dPin = L.marker(destLatLon, { icon: mkIcon('#c62828','●') })
      .addTo(map)
      .bindPopup('<strong>Destino</strong><br>' + document.getElementById('destInp').value);
    routePins = [oPin, dPin];

    map.fitBounds(routePolyline.getBounds(), { padding: [45, 45] });

    // Info
    const d = route.distance, t = route.duration;
    document.getElementById('infoDist').textContent = d >= 1000 ? (d/1000).toFixed(1) + ' km' : Math.round(d) + ' m';
    document.getElementById('infoTime').textContent = fmtTime(t);
    document.getElementById('routeInfo').classList.add('show');
    document.getElementById('btnClearRoute').style.display = '';

  } catch (e) {
    setErr('routeErr', e.message);
  } finally {
    btn.disabled = false; sp.classList.remove('a');
  }
}

function clearRoute(full = true) {
  if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
  routePins.forEach(p => map.removeLayer(p)); routePins = [];
  document.getElementById('routeInfo').classList.remove('show');
  if (full) {
    document.getElementById('btnClearRoute').style.display = 'none';
    document.getElementById('originInp').value = '';
    document.getElementById('destInp').value   = '';
    originLatLon = null; destLatLon = null;
    setErr('routeErr', '');
  }
}

function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}min` : `${m} min`;
}

/* ══════════════════════════════════════════════
   MUNICIPALITY TAB — IBGE
══════════════════════════════════════════════ */
async function loadMunis() {
  const listEl = document.getElementById('muniList');
  listEl.innerHTML = '<div class="ac-msg">Carregando municípios…</div>';
  setErr('muniErr', '');
  try {
    const res  = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/33/municipios');
    if (!res.ok) throw new Error('Falha ao carregar lista');
    const raw  = await res.json();
    muniData   = raw.map(m => ({ id: m.id, nome: m.nome }))
                    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
    renderMuniList(muniData);
  } catch (e) {
    listEl.innerHTML = '';
    setErr('muniErr', 'Erro ao carregar municípios: ' + e.message);
  }
}

function renderMuniList(list) {
  const listEl = document.getElementById('muniList');
  if (!list.length) { listEl.innerHTML = '<div class="ac-msg">Nenhum município encontrado.</div>'; return; }

  listEl.innerHTML = list.map(m => {
    const color   = muniColors[m.id] || '#3498db';
    const checked = !!muniLayers[m.id];
    return `<div class="muni-item ${checked ? 'on' : ''}" id="mi-${m.id}">
      <input type="checkbox" class="muni-cb" id="cb-${m.id}" ${checked ? 'checked' : ''}
             onchange="toggleMuni(${m.id},'${escHtml(m.nome)}',this)" />
      <label class="muni-nm" for="cb-${m.id}">${m.nome}</label>
      <span class="muni-spin" id="sp-${m.id}"></span>
      <input type="color" class="muni-clr" value="${color}"
             style="background:${color}"
             title="Cor de ${m.nome}"
             onchange="changeMuniColor(${m.id},this.value)" />
    </div>`;
  }).join('');
}

function filterMunis() {
  const q = document.getElementById('muniFilter').value.trim().toLowerCase();
  renderMuniList(muniData.filter(m => m.nome.toLowerCase().includes(q)));
}

async function toggleMuni(id, nome, cb) {
  const item = document.getElementById(`mi-${id}`);
  const sp   = document.getElementById(`sp-${id}`);

  if (!cb.checked) {
    if (muniLayers[id]) { map.removeLayer(muniLayers[id]); delete muniLayers[id]; }
    item.classList.remove('on');
    return;
  }

  cb.disabled = true;
  sp.classList.add('a');
  item.classList.add('on');

  if (!muniColors[id]) {
    muniColors[id] = pickColor();
    const clrInp = item.querySelector('.muni-clr');
    if (clrInp) { clrInp.value = muniColors[id]; clrInp.style.background = muniColors[id]; }
  }

  try {
    const url  = `https://servicodados.ibge.gov.br/api/v3/malhas/municipios/${id}?formato=application/vnd.geo+json`;
    const res  = await fetch(url);
    if (!res.ok) throw new Error('Falha ao obter fronteira');
    const geo  = await res.json();
    const c    = muniColors[id];

    const layer = L.geoJSON(geo, {
      style: { color: c, weight: 2.5, opacity: 1, fillColor: c, fillOpacity: .22 }
    })
    .bindTooltip(nome, { sticky: true, className: 'muni-tip', direction: 'center' })
    .on('click', () => map.fitBounds(layer.getBounds(), { padding: [30,30], maxZoom: 13 }))
    .addTo(map);

    muniLayers[id] = layer;
    map.fitBounds(layer.getBounds(), { padding: [30,30], maxZoom: 13 });

  } catch (e) {
    cb.checked = false;
    item.classList.remove('on');
    setErr('muniErr', `Erro ao carregar ${nome}: ${e.message}`);
  } finally {
    cb.disabled = false;
    sp.classList.remove('a');
  }
}

function changeMuniColor(id, color) {
  muniColors[id] = color;
  if (muniLayers[id]) {
    muniLayers[id].setStyle({ color, fillColor: color });
  }
}

function markAllVisible() {
  const q = document.getElementById('muniFilter').value.trim().toLowerCase();
  muniData.filter(m => m.nome.toLowerCase().includes(q)).forEach(m => {
    const cb = document.getElementById(`cb-${m.id}`);
    if (cb && !cb.checked) { cb.checked = true; toggleMuni(m.id, m.nome, cb); }
  });
}

function clearAllMunis() {
  Object.entries(muniLayers).forEach(([id, layer]) => {
    map.removeLayer(layer);
    const cb   = document.getElementById(`cb-${id}`);
    const item = document.getElementById(`mi-${id}`);
    if (cb)   cb.checked = false;
    if (item) item.classList.remove('on');
  });
  muniLayers = {};
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function setErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

function escHtml(s) {
  return s.replace(/'/g, "\\'");
}
</script>
