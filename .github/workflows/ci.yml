# CI — roda o gate de pré-publicação (tests/check.js) em todo push e PR.
# Antes não havia automação: o gate só rodava se alguém lembrasse de `node tests/check.js`
# antes do push. Agora cada push/PR valida sintaxe do <script> inline, guarda anti-drift
# e os testes unitários. Node puro, sem dependências — roda em segundos.
#
# Os `uses:` estão presos ao SHA (o `# v4` ao lado é só legenda) — ver docs/semgrep.md
# § "Actions presas ao SHA".
name: CI

# `push` restrito à `main` desde 30/07/2026 (PR 1 do plano da auditoria preliminar de 30/07).
# Antes era `push:` sem filtro, e como este workflow também roda em `pull_request`, TODO push numa
# branch com PR aberto disparava o gate DUAS vezes. Medido no PR #85: 8 execuções onde 4 bastavam.
#
# A cobertura não muda: toda mudança continua verificada antes do merge (pelo `pull_request`), e
# push direto na `main` segue coberto (pelo `push`). O que muda é só o gasto e o ruído.
#
# CUSTO ACEITO, para quem for mexer nisso: push numa branch SEM PR aberto não dispara mais nada.
# Quem quiser o veredito antes de abrir o PR tem duas saídas — `node tests/check.js` local (que é
# o gate deste arquivo, em segundos) ou a aba Actions → Run workflow, que é o `workflow_dispatch`
# abaixo, acrescentado junto com esta mudança justamente por causa dela.
#
# Os outros quatro gates (views, semgrep, deriva, db-checks) receberam o mesmo tratamento no mesmo
# commit — se um dia voltar `push:` sem filtro em algum, a duplicação volta só naquele, em silêncio.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN no mínimo: nenhum destes workflows faz push, abre PR ou comenta.
# Sem este bloco o token herda o default do repo/organização, que pode ser contents: write
# (achado SEC-07 da auditoria de 27/07/2026).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # nenhum job faz push; token fora do .git/config do runner
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Gate de pré-publicação (sintaxe + anti-drift + testes)
        run: node tests/check.js
      # NÃO declare `NO_PROXY` e `no_proxy` como duas chaves deste `env:`. O YAML aceita (são
      # chaves distintas) e o PyYAML também, mas o validador do GitHub trata nome de variável
      # de ambiente como CASE-INSENSITIVE e rejeita o par como duplicado. Workflow rejeitado
      # não falha num job vermelho que se vê: o run nasce e morre no mesmo segundo, com ZERO
      # jobs, o nome cai para o caminho do arquivo (`.github/workflows/ci.yml` em vez de `CI`)
      # e nem os filtros de `on:` chegam a ser avaliados — por isso passou a disparar até em
      # push de branch, que a linha 26 restringe. Foi assim que este gate ficou morto entre
      # 31/07 12:26 e 16:5x sem ninguém notar (o PR verde não mostra o que não rodou).
      # A variável minúscula continua sendo exportada, só que no shell, onde não há colisão.
      - name: Bancadas offline de backup e restauração
        env:
          NO_PROXY: 127.0.0.1
        run: |
          export no_proxy="$NO_PROXY"
          node tests/backup_rest.rig.mjs
          node tests/restore_rest.rig.mjs
