# Deriva (docs × banco) — roda scripts/check_deriva.mjs.
#
# Por que existe: as 8 divergências da auditoria de 26/07/2026 nasceram todas de um fato do
# banco copiado à mão para um doc e nunca mais conferido. O script pergunta ao PostgREST o
# OpenAPI de `anon` (mesma anon key pública do app.js — nenhum segredo aqui) e compara com o
# que CLAUDE.md / docs/schema.md / app.js afirmam.
#
#
# ESCOPO: os scripts deste workflow só enxergam PRODUÇÃO (`Banco - Divat`,
# lwzsxuaqqeoamukduhev) — leem SB_URL/SB_KEY do app.js e não têm como apontar para outro
# projeto. O banco de TESTE (`divat - TESTE`) não é vigiado aqui nem em lugar nenhum.
# Por que SEMANAL além de push/PR: a deriva nasce de mudança NO BANCO (que não gera push)
# tanto quanto de mudança nos docs — mesma razão do backup.yml. O filtro de `paths` cobre o
# lado do repo; o cron cobre o lado do banco.
#
# ARQUIVO/JOB separado (padrão do repo: um workflow por preocupação — um vermelho não esconde
# o outro) e FORA do tests/check.js (contrato dele: offline e sem dependências; este precisa
# de rede até o Supabase).
#
# Os `uses:` estão presos ao SHA (o `# v4` ao lado é só legenda) — ver docs/semgrep.md
# § "Actions presas ao SHA".
name: Deriva

on:
  schedule:
    - cron: '0 7 * * 1' # toda segunda 07:00 UTC (1 h depois do backup semanal)
  workflow_dispatch:
  # `branches: [main]` para não rodar duas vezes por push em branch com PR aberto — o porquê
  # completo, e o custo aceito, estão no cabeçalho do ci.yml. O filtro de `paths` abaixo continua
  # valendo por cima: na `main`, só roda se um destes arquivos mudou.
  push:
    branches: [main]
    paths:
      - CLAUDE.md
      - docs/schema.md
      - app.js
      - scripts/check_deriva.mjs
      - .github/workflows/deriva.yml
  pull_request:
    paths:
      - CLAUDE.md
      - docs/schema.md
      - app.js
      - scripts/check_deriva.mjs
      - .github/workflows/deriva.yml

# GITHUB_TOKEN no mínimo: nenhum destes workflows faz push, abre PR ou comenta.
# Sem este bloco o token herda o default do repo/organização, que pode ser contents: write
# (achado SEC-07 da auditoria de 27/07/2026).
permissions:
  contents: read

jobs:
  deriva:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # nenhum job faz push; token fora do .git/config do runner
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Verificador de deriva docs×banco
        run: node scripts/check_deriva.mjs
