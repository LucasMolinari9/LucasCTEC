# Deriva (docs × banco) — roda scripts/check_deriva.mjs.
#
# Por que existe: as 8 divergências da auditoria de 26/07/2026 nasceram todas de um fato do
# banco copiado à mão para um doc e nunca mais conferido. O script pergunta ao PostgREST a visão
# de `anon` (RPC `divat_api_shape()`) e compara com o que CLAUDE.md / docs/schema.md / app.js
# afirmam. Chave anon pública, nenhum segredo aqui.
#
# ALVO (desde 04/08/2026, issue #74): até a Fase 3, este gate lia SB_URL/SB_KEY dos literais do
# app.js — que são de PRODUÇÃO, então um PR podia falar com produção sem ninguém pedir. Agora
# quem decide é DIVAT_ALVO, resolvido por scripts/lib/ambiente.mjs contra scripts/ambientes.json,
# e quem decide DIVAT_ALVO é o GATILHO: `teste` em pull_request/push, `producao` no cron e no
# dispatch (os dois são monitoramento: o dispatch existe para conferir produção sob demanda,
# porque alimentar o banco pelo painel do Supabase não gera push nenhum). A
# variável vai no `env:` do PASSO, não no do workflow, para a decisão ficar ao lado do comando
# que ela governa. Sem a variável o script morre no topo — falha fechada, de propósito.
#
# Por que SEMANAL além de push/PR: a deriva nasce de mudança NO BANCO (que não gera push)
# tanto quanto de mudança nos docs — mesma razão do backup.yml. O filtro de `paths` cobre o
# lado do repo; o cron cobre o lado do banco.
#
# ARQUIVO/JOB separado (padrão do repo: um workflow por preocupação — um vermelho não esconde
# o outro) e FORA do tests/check.js (contrato dele: offline e sem dependências; este precisa
# de rede até o Supabase).
#
# Os `uses:` estão presos ao SHA (o `# v4` ao lado é só legenda) — ver docs/semgrep.md
# § "Actions presas ao SHA".
name: Deriva

on:
  schedule:
    - cron: '0 7 * * 1' # toda segunda 07:00 UTC (1 h depois do backup semanal)
  workflow_dispatch:
  # `branches: [main]` para não rodar duas vezes por push em branch com PR aberto — o porquê
  # completo, e o custo aceito, estão no cabeçalho do ci.yml. O filtro de `paths` abaixo continua
  # valendo por cima: na `main`, só roda se um destes arquivos mudou.
  push:
    branches: [main]
    paths:
      - CLAUDE.md
      - docs/schema.md
      - app.js
      - scripts/check_deriva.mjs
      # Decidem de qual banco este gate fala; mudá-los sem rodá-lo é deriva de alvo (Codex, P2).
      - scripts/ambientes.json
      - scripts/lib/ambiente.mjs
      - .github/workflows/deriva.yml
  pull_request:
    paths:
      - CLAUDE.md
      - docs/schema.md
      - app.js
      - scripts/check_deriva.mjs
      # Decidem de qual banco este gate fala; mudá-los sem rodá-lo é deriva de alvo (Codex, P2).
      - scripts/ambientes.json
      - scripts/lib/ambiente.mjs
      - .github/workflows/deriva.yml

# GITHUB_TOKEN no mínimo: nenhum destes workflows faz push, abre PR ou comenta.
# Sem este bloco o token herda o default do repo/organização, que pode ser contents: write
# (achado SEC-07 da auditoria de 27/07/2026).
permissions:
  contents: read

jobs:
  deriva:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # nenhum job faz push; token fora do .git/config do runner
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Verificador de deriva docs×banco
        env:
          DIVAT_ALVO: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'producao' || 'teste' }}
        run: node scripts/check_deriva.mjs
