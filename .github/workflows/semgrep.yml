# Semgrep — análise estática (SAST) em todo push e PR. Ver docs/semgrep.md.
#
# É COMPLEMENTAR ao ci.yml, não substituto: o `node tests/check.js` valida sintaxe,
# anti-drift e a lógica pura (o que o projeto FAZ); o Semgrep procura padrão perigoso
# (o que o projeto NÃO PODE fazer). São gates separados de propósito — um pode ficar
# vermelho sem esconder o resultado do outro.
#
# Três metades (sic), na ordem de quem depende de menos coisa:
#   [1] regras locais (.semgrep/rules/) — offline, deterministas, escritas pra este portal.
#       Rodam antes: se quebrarem, é problema NOSSO, e o log fica no topo.
#   [2] rulesets VENDORIZADOS (.semgrep/vendor/) — cópia versionada dos mesmos rulesets do [3].
#       É EXATAMENTE o que `./scripts/semgrep.sh` roda na máquina de quem desenvolve, e existe
#       para que verde local seja evidência de verde aqui. Antes dele, não era: em 09/08/2026,
#       3 achados de `run-shell-injection` passaram do local para o CI justamente por essa
#       diferença (docs/historico/contexto-proxima-sessao-2026-08-09.md).
#   [3] rulesets públicos ao vivo (p/javascript, p/xss, p/secrets, p/github-actions) — baixados
#       de semgrep.dev. Precisam de rede; por isso não dá pra rodar essa metade no ambiente do
#       agente Claude (saída bloqueada), só aqui e na máquina do dono. Continua sendo a
#       AUTORIDADE: é ele que percebe regra nova a montante. [2] verde + [3] vermelho tem
#       diagnóstico único — a cópia vendorizada está velha, rode `atualizar-semgrep-rulesets`.
#
# Sem upload SARIF / Code Scanning. A justificativa antiga ("exige GitHub Advanced Security, que
# este repo privado no plano free não tem") caiu junto com a premissa: o repo é PÚBLICO desde
# 31/07/2026 (docs/adr/0003-repositorio-publico.md), e em repo público o Code Scanning é gratuito.
# Continua de fora por escolha, não por impedimento — o ganho seria ergonomia (achado vira anotação
# no diff), não cobertura nova. O resultado fica no log do job, e o job falha se houver achado.
#
# Os `uses:` estão presos ao SHA (o `# v4` ao lado é só legenda) — ver docs/semgrep.md
# § "Actions presas ao SHA". Foi a regra `github-actions-mutable-action-tag` deste próprio
# workflow que apontou isso, nos 3 arquivos.
#
# Versão FIXA (mesma disciplina do supabase-js vendorado): atualizar o Semgrep é uma decisão,
# não um efeito colateral de um push qualquer — uma versão nova pode trazer regra nova e
# deixar vermelho um PR que não mexeu em nada disso. Pra subir: troque o número abaixo,
# rode `./scripts/semgrep.sh --full` localmente e resolva os achados no mesmo commit.
name: Semgrep

# `push` restrito à `main` para não rodar duas vezes por push em branch com PR aberto — o porquê
# completo, e o custo aceito, estão no cabeçalho do ci.yml. O `workflow_dispatch` entrou junto.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN no mínimo: nenhum destes workflows faz push, abre PR ou comenta.
# Sem este bloco o token herda o default do repo/organização, que pode ser contents: write
# (achado SEC-07 da auditoria de 27/07/2026).
permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # nenhum job faz push; token fora do .git/config do runner
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar Semgrep (versão fixa)
        run: pip install semgrep==1.171.0

      # --metrics=off em ambas: nada de telemetria de código pra semgrep.dev. A razão NÃO é a
      # visibilidade do repo (ele é público) — é não mandar dado do projeto para terceiro sem
      # necessidade. A justificativa "porque o repo é privado" ficou velha em 31/07/2026.
      # --error faz o job falhar quando há achado (sem isso o Semgrep sai 0 e o gate é decorativo).
      - name: '[1] Regras locais do portal (offline)'
        run: semgrep scan --config=.semgrep/rules --metrics=off --error .

      # [2] roda EXATAMENTE o que `./scripts/semgrep.sh` roda na máquina de quem desenvolve.
      # Está antes do registry ao vivo de propósito: se este passar e o [3] reprovar, o
      # diagnóstico é imediato — a cópia vendorizada está velha, rode o workflow
      # `atualizar-semgrep-rulesets`. Antes disto existir, a diferença entre local e CI era
      # invisível até o PR ficar vermelho sem explicação (foi assim que 3 achados de
      # `run-shell-injection` chegaram ao CI em 09/08).
      #
      # O `if:` cobre o estado transitório em que `.semgrep/vendor/` ainda não foi preenchido:
      # sem ele, o passo falharia por config inexistente e pareceria achado.
      - name: '[2] Rulesets vendorizados (offline — o mesmo que roda local)'
        if: hashFiles('.semgrep/vendor/*.yml') != ''
        run: semgrep scan --config=.semgrep/vendor --metrics=off --error .

      - name: '[3] Rulesets públicos (registry ao vivo)'
        run: >-
          semgrep scan
          --config=p/javascript
          --config=p/xss
          --config=p/secrets
          --config=p/github-actions
          --metrics=off --error .

      # Guarda das próprias regras: garante que cada regra de .semgrep/rules/ ainda pega o
      # caso ruim E ignora o bom (.semgrep/tests/). Roda por último porque é meta — se falhar,
      # o problema está na REGRA, não no código do portal.
      - name: '[4] Testes das regras locais'
        run: semgrep --test --metrics=off --config=.semgrep/rules .semgrep/tests
