# Semgrep — análise estática (SAST) em todo push e PR. Ver docs/semgrep.md.
#
# É COMPLEMENTAR ao ci.yml, não substituto: o `node tests/check.js` valida sintaxe,
# anti-drift e a lógica pura (o que o projeto FAZ); o Semgrep procura padrão perigoso
# (o que o projeto NÃO PODE fazer). São gates separados de propósito — um pode ficar
# vermelho sem esconder o resultado do outro.
#
# Duas metades, na ordem de quem depende de menos coisa:
#   [1] regras locais (.semgrep/rules/) — offline, deterministas, escritas pra este portal.
#       Rodam antes: se quebrarem, é problema NOSSO, e o log fica no topo.
#   [2] rulesets públicos (p/javascript, p/xss, p/secrets, p/github-actions) — baixados de
#       semgrep.dev. Precisam de rede; por isso não dá pra rodar essa metade no ambiente do
#       agente Claude (saída bloqueada), só aqui e na máquina do dono.
#
# Sem upload SARIF: os achados ficam no log do job, e o job falha se houver algum. Até
# 30/07/2026 a razão escrita aqui era que Code Scanning "exige GitHub Advanced Security, que
# este repo (privado, plano free) não tem" — isso caducou quando o repositório virou PÚBLICO
# (em repositório público o Code Scanning é gratuito). A razão hoje é outra e é deliberada:
# o `--error` faz este gate REPROVAR o push, que é o comportamento que se quer de uma regra
# escrita para este portal; SARIF publica alerta, não bloqueia. Quem ocupa a aba Security é o
# `codeql.yml`, criado junto com esta correção. Se um dia os dois convergirem, o caminho é
# somar o `--sarif` aqui com um passo de upload, não trocar o `--error` por ele.
#
# Os `uses:` estão presos ao SHA (o `# v4` ao lado é só legenda) — ver docs/semgrep.md
# § "Actions presas ao SHA". Foi a regra `github-actions-mutable-action-tag` deste próprio
# workflow que apontou isso, nos 3 arquivos.
#
# Versão FIXA (mesma disciplina do supabase-js vendorado): atualizar o Semgrep é uma decisão,
# não um efeito colateral de um push qualquer — uma versão nova pode trazer regra nova e
# deixar vermelho um PR que não mexeu em nada disso. Pra subir: troque o número abaixo,
# rode `./scripts/semgrep.sh --full` localmente e resolva os achados no mesmo commit.
name: Semgrep

on:
  push:
  pull_request:

# GITHUB_TOKEN no mínimo: nenhum destes workflows faz push, abre PR ou comenta.
# Sem este bloco o token herda o default do repo/organização, que pode ser contents: write
# (achado SEC-07 da auditoria de 27/07/2026).
permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # nenhum job faz push; token fora do .git/config do runner
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar Semgrep (versão fixa)
        run: pip install semgrep==1.171.0

      # --metrics=off em ambas. A razão antiga ("o repo é privado") caiu com a mudança de
      # visibilidade; a atual é mais simples e não depende disso: o gate roda em todo push, e
      # nada aqui precisa sair para semgrep.dev além do download das regras. Telemetria que
      # não serve a ninguém deste lado é superfície de graça.
      # --error faz o job falhar quando há achado (sem isso o Semgrep sai 0 e o gate é decorativo).
      - name: '[1] Regras locais do portal (offline)'
        run: semgrep scan --config=.semgrep/rules --metrics=off --error .

      - name: '[2] Rulesets públicos (registry)'
        run: >-
          semgrep scan
          --config=p/javascript
          --config=p/xss
          --config=p/secrets
          --config=p/github-actions
          --metrics=off --error .

      # Guarda das próprias regras: garante que cada regra de .semgrep/rules/ ainda pega o
      # caso ruim E ignora o bom (.semgrep/tests/). Roda por último porque é meta — se falhar,
      # o problema está na REGRA, não no código do portal.
      - name: '[3] Testes das regras locais'
        run: semgrep --test --metrics=off --config=.semgrep/rules .semgrep/tests
