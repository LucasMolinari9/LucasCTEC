# TEMPORÁRIO — backup fresco antes do REVOKE do ticket 06 (.scratch/doc-drift/).
#
# Cópia fiel do job do backup.yml, disparada por push NESTA branch: o dispatch manual do
# backup.yml é negado para a integração do Claude (403) e o ambiente dele não alcança
# *.supabase.co — o runner do Actions alcança. Este arquivo é removido no commit seguinte
# ao backup verde; o backup.yml (semanal + manual) segue sendo o oficial.
name: Backup pré-REVOKE (temporário)

on:
  push:
    branches:
      - claude/doc-drift-scratch-8wdcal
    paths:
      - .github/workflows/backup-pre-revoke.yml

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Dump NDJSON via REST (modo público)
        env:
          SUPABASE_URL: https://lwzsxuaqqeoamukduhev.supabase.co
          # anon key — pública por design (é a mesma embutida no index.html servido a todo visitante)
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3enN4dWFxcWVvYW11a2R1aGV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTk4NjYsImV4cCI6MjA5NTQ5NTg2Nn0.90R-n9pu_gpDfmRr7O4DMAdjtIUkIDGyEKfG9zXXV1s
        run: node scripts/backup_rest.mjs ./backup_out
      - name: Publicar artifact (90 dias)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divat-backup-pre-revoke-${{ github.run_id }}
          path: backup_out/
          retention-days: 90
          if-no-files-found: error
